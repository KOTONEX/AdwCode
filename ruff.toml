# 固定工具版本与 Python 兼容范围，使本地和 CI 的格式一致。
required-version = "==0.16.9"
target-version = "py39"
line-length = 100
extend-exclude = ["builddir", ".tools", ".kilo/worktrees"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
known-first-party = ["生成主题", "检查样式", "界面映射", "打包扩展", "调色板", "语法映射", "更新默认数据"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

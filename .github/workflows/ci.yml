name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: 静态检查与离线测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Rust 工具链
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 安装 TypeScript
        run: npm install -g typescript

      - name: 完整检查
        run: cargo run --quiet -- 检查

      - name: 生成主题并校验无差异
        run: |
          cargo run --quiet -- 主题
          git diff --exit-code -- 主题 package.json

      - name: 自动生成变更日志
        run: cargo run --quiet -- 变更日志

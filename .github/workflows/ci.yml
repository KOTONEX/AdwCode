name: 持续集成

on:
  push:
    branches: [main, rust]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: 静态检查与离线测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Rust 工具链
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 安装 TypeScript
        run: npm install -g typescript

      - name: 完整检查
        run: cargo run --quiet -- 检查

      - name: 生成主题并校验无差异
        run: |
          cargo run --quiet -- 主题
          cargo run --quiet -- 生成自有字形
          cargo run --quiet -- 生成导入字形
          git diff --exit-code -- 主题 产品图标 package.json

      - name: 自动生成变更日志
        run: cargo run --quiet -- 变更日志

      - name: 判断宿主相关改动
        id: changes
        run: node 测试/宿主触发.cjs

      - name: 确定最新稳定宿主与验收周
        id: host-version
        shell: python
        run: |
          import datetime, json, os, re, subprocess
          from pathlib import Path
          版本 = json.loads(subprocess.check_output(['curl', '--fail', '--silent', '--show-error', '--max-time', '30',
              'https://update.code.visualstudio.com/api/releases/stable?released=true'], text=True))[0]
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', 版本):
              raise RuntimeError('最新宿主版本格式错误')
          周 = datetime.datetime.now(datetime.timezone.utc).strftime('%G-%V')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as 输出:
              输出.write(f'版本={版本}\n周={周}\n')

      - name: 恢复本周最新版宿主验收记录
        id: weekly-host
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/adwcode-宿主周记录
          key: host-week-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-version.outputs['版本'] }}-${{ steps.host-version.outputs['周'] }}

      - name: 判断是否运行宿主
        id: host-plan
        env:
          相关: ${{ steps.changes.outputs['相关'] }}
          已验收: ${{ steps.weekly-host.outputs.cache-hit }}
        shell: python
        run: |
          import os
          from pathlib import Path
          运行 = os.environ['相关'] == 'true' or os.environ['已验收'] != 'true'
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as 输出:
              输出.write(f'运行={str(运行).lower()}\n')

      - name: 缓存固定版本编辑器
        if: steps.host-plan.outputs['运行'] == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/adwcode-编辑器
          key: vscode-host-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-version.outputs['版本'] }}

      - name: 独立扩展宿主测试
        if: steps.host-plan.outputs['运行'] == 'true'
        env:
          HOST_VERSION: ${{ steps.host-version.outputs['版本'] }}
        run: |
          npm install --prefix "$RUNNER_TEMP/adwcode-host-tools" @vscode/test-electron
          node 测试/下载宿主.cjs "$RUNNER_TEMP/adwcode-host-tools" "$HOST_VERSION" "$RUNNER_TEMP/adwcode-编辑器" > "$RUNNER_TEMP/adwcode-host-path"
          xvfb-run -a cargo run --quiet -- 宿主测试 --禁用沙箱 --编辑器程序 "$(tail -n 1 "$RUNNER_TEMP/adwcode-host-path")"

      - name: 记录本周成功宿主验收
        if: steps.host-plan.outputs['运行'] == 'true'
        shell: python
        run: |
          import os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'adwcode-宿主周记录').write_text('成功', encoding='utf-8')

      - name: 构建并记录同提交发布工具
        if: github.event_name == 'push'
        shell: python
        run: |
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          subprocess.run(['cargo', 'build', '--release', '--quiet'], check=True)
          目录 = Path(os.environ['RUNNER_TEMP']) / 'adwcode-工具'
          目录.mkdir()
          程序 = 目录 / 'adwcode'
          shutil.copyfile('target/release/adwcode', 程序)
          提交 = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          元数据 = {'提交': 提交, '平台': 'linux-x64', 'sha256': hashlib.sha256(程序.read_bytes()).hexdigest()}
          (目录 / '元数据.json').write_text(json.dumps(元数据, ensure_ascii=False), encoding='utf-8')

      - name: 保存同提交发布工具
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: adwcode-工具-${{ github.sha }}
          path: ${{ runner.temp }}/adwcode-工具/
          if-no-files-found: error
          retention-days: 30

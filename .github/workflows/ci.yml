name: 持续集成

on:
  push:
    branches: [main, rust]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: 静态检查与离线测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Rust 工具链
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 安装 TypeScript
        run: npm install -g typescript@7.0.2

      - name: 完整检查
        run: cargo run --quiet -- 检查

      - name: 生成主题并校验无差异
        run: |
          cargo run --quiet -- 主题
          cargo run --quiet -- 生成自有字形
          cargo run --quiet -- 生成导入字形
          git diff --exit-code -- 主题 产品图标 package.json

      - name: 自动生成变更日志
        run: cargo run --quiet -- 变更日志

      - name: 判断宿主相关改动
        id: changes
        run: cargo run --quiet -- 持续集成 宿主改动

      - name: 确定最新稳定宿主与验收周
        id: host-version
        run: cargo run --quiet -- 持续集成 宿主版本

      - name: 恢复本周最新版宿主验收记录
        id: weekly-host
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/adwcode-宿主周记录
          key: host-week-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-version.outputs['版本'] }}-${{ steps.host-version.outputs['周'] }}

      - name: 判断是否运行宿主
        id: host-plan
        env:
          相关: ${{ steps.changes.outputs['相关'] }}
          已验收: ${{ steps.weekly-host.outputs.cache-hit }}
        run: cargo run --quiet -- 持续集成 宿主计划

      - name: 缓存固定版本编辑器
        if: steps.host-plan.outputs['运行'] == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/adwcode-编辑器
          key: vscode-host-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-version.outputs['版本'] }}

      - name: 独立扩展宿主测试
        if: steps.host-plan.outputs['运行'] == 'true'
        env:
          HOST_VERSION: ${{ steps.host-version.outputs['版本'] }}
        run: |
          npm install --prefix "$RUNNER_TEMP/adwcode-host-tools" @vscode/test-electron
          node builddir/脚本/测试/下载宿主.js "$RUNNER_TEMP/adwcode-host-tools" "$HOST_VERSION" "$RUNNER_TEMP/adwcode-编辑器" > "$RUNNER_TEMP/adwcode-host-path"
          xvfb-run -a cargo run --quiet -- 宿主测试 --禁用沙箱 --编辑器程序 "$(tail -n 1 "$RUNNER_TEMP/adwcode-host-path")"

      - name: 记录本周成功宿主验收
        if: steps.host-plan.outputs['运行'] == 'true'
        run: cargo run --quiet -- 持续集成 宿主成功

      - name: 构建并记录同提交发布工具
        if: github.event_name == 'push'
        run: |
          cargo build --release --quiet
          ./target/release/adwcode 持续集成 登记工具

      - name: 保存同提交发布工具
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: adwcode-工具-${{ github.sha }}
          path: ${{ runner.temp }}/adwcode-工具/
          if-no-files-found: error
          retention-days: 30

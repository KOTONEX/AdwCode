name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: 静态检查与离线测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装自由线程 Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          freethreaded: true

      - name: 安装检查工具（Ruff / ty / tsc）
        run: |
          "${{ steps.python.outputs.python-path }}" -m pip install ruff==0.16.9 ty meson ninja
          npm install -g typescript

      - name: 配置 Meson
        run: meson setup builddir -Dpython="${{ steps.python.outputs.python-path }}"

      - name: 静态、格式与类型检查
        run: meson compile -C builddir lint

      - name: 生成/构建校验
        run: |
          meson compile -C builddir themes
          git diff --exit-code -- themes package.json

      - name: 离线单元测试
        run: meson test -C builddir --print-errorlogs

      - name: 自动生成变更日志
        run: meson compile -C builddir changelog

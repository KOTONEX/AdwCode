name: 发布

# 推送与清单版本一致的 v<版本> 标签时：校验 → 测试 → 打包 → 上传到对应 Release。
# 仓库中不保存 VSIX，构建产物只作为 Release 附件发布。
# 变更日志与发布说明按 Git 版本标签和提交标题自动生成；配置 VSCE_PAT / OVSX_PAT 后
# 只有标签提交已进入 main 且版本不是预发布时，同一 VSIX 才会同步发布到 VS Code 扩展市场与 Open VSX（缺失时跳过）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Rust 工具链
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 安装 TypeScript
        run: npm install -g typescript

      - name: 判断候选与市场发布权限
        id: policy
        run: cargo run --quiet -- 发布策略 --引用 "$GITHUB_REF" --输出 "$GITHUB_OUTPUT"

      - name: 完整检查
        run: cargo run --quiet -- 检查

      - name: 生成/构建校验
        run: |
          cargo build --release --quiet
          ./target/release/adwcode 主题
          ./target/release/adwcode 生成自有字形
          ./target/release/adwcode 生成导入字形
          git diff --exit-code -- 主题 产品图标 package.json

      - name: 打包
        run: ./target/release/adwcode 打包

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.policy.outputs['候选'] }}
          LATEST: ${{ steps.policy.outputs['候选'] != 'true' }}
          VERSION: ${{ steps.policy.outputs['版本'] }}
        run: |
          vsix="AdwCode-$VERSION.vsix"
          # 从当前标签的提交范围生成说明，标签必须严格对应 HEAD 与清单版本。
          ./target/release/adwcode 发布说明 --标签 "$GITHUB_REF_NAME"
          # 标签对应固定提交；重复发布保留已有附件，只补齐缺失附件并更新说明。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            asset_names="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
            has_asset=false
            while IFS= read -r asset_name; do
              if [ "$asset_name" = "$vsix" ]; then
                has_asset=true
                break
              fi
            done <<< "$asset_names"
            if [ "$has_asset" = false ]; then
              gh release upload "$GITHUB_REF_NAME" "$vsix"
            else
              # 后续市场发布复用已公开的同一份 VSIX。
              gh release download "$GITHUB_REF_NAME" --pattern "$vsix" --dir . --clobber
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --prerelease="$PRERELEASE" --latest="$LATEST" \
              --notes-file builddir/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$vsix" --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --prerelease="$PRERELEASE" --latest="$LATEST" \
              --notes-file builddir/release-notes.md
          fi

      - name: 发布到扩展市场
        if: startsWith(github.ref, 'refs/tags/v') && steps.policy.outputs['市场'] == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ steps.policy.outputs['版本'] }}
        run: |
          vsix="AdwCode-$VERSION.vsix"
          version="$VERSION"

          if [ -z "$VSCE_PAT" ]; then
            printf '%s\n' '（未配置 VSCE_PAT，跳过 VS Code 扩展市场）'
          else
            # --skip-duplicate：标签重复运行时，已发布的同一版本不算失败。
            npx --yes @vscode/vsce publish --packagePath "$vsix" -p "$VSCE_PAT" --skip-duplicate
          fi

          if [ -z "$OVSX_PAT" ]; then
            printf '%s\n' '（未配置 OVSX_PAT，跳过 Open VSX）'
          elif curl -fsS "https://open-vsx.org/api/KOTONEX/AdwCode/$version" >/dev/null 2>&1; then
            printf '%s\n' "Open VSX 已存在 $version，跳过"
          else
            npx --yes ovsx publish "$vsix" -p "$OVSX_PAT"
          fi

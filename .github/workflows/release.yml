name: 发布

# 推送形如 v1.0.0 的标签时：校验 → 测试 → 打包 → 上传到对应 Release。
# 仓库中不保存 VSIX，构建产物只作为 Release 附件发布。
# 发布说明取自 CHANGELOG.md 的对应版本；配置 VSCE_PAT / OVSX_PAT 后
# 同一 VSIX 会同步发布到 VS Code 扩展市场与 Open VSX（缺失时跳过）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装自由线程 Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          freethreaded: true

      - name: 校验标签与版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "标签 $GITHUB_REF_NAME 与 package.json 的版本 $version 不一致" >&2
            exit 1
          fi
          echo "版本：$version"

      - name: 安装检查工具
        run: |
          "${{ steps.python.outputs.python-path }}" -m pip install ruff==0.16.9 ty meson ninja
          npm install -g typescript

      - name: 配置 Meson
        run: meson setup builddir -Dpython="${{ steps.python.outputs.python-path }}"

      - name: 静态、格式与类型检查
        run: meson compile -C builddir lint

      - name: 生成/构建校验
        run: |
          meson compile -C builddir themes
          git diff --exit-code -- themes package.json

      - name: 离线单元测试
        run: meson test -C builddir --print-errorlogs

      - name: 打包
        run: meson compile -C builddir package

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vsix="$(ls -1 *.vsix | head -1)"
          # 从版本更新日志提取公开发布说明，避免混入开发过程记录。
          "${{ steps.python.outputs.python-path }}" src/release_notes.py
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            printf '\n**完整变更**：https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> release-notes.md
          fi
          # 标签对应固定提交；重复发布保留已有附件，只补齐缺失附件并更新说明。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            asset_names="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
            has_asset=false
            while IFS= read -r asset_name; do
              if [ "$asset_name" = "$vsix" ]; then
                has_asset=true
                break
              fi
            done <<< "$asset_names"
            if [ "$has_asset" = false ]; then
              gh release upload "$GITHUB_REF_NAME" "$vsix"
            else
              # 后续市场发布复用已公开的同一份 VSIX，而非带新归档时间戳的重建文件。
              gh release download "$GITHUB_REF_NAME" --pattern "$vsix" --dir . --clobber
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$vsix" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

      - name: 发布到扩展市场
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          vsix="$(ls -1 *.vsix | head -1)"
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"

          if [ -z "$VSCE_PAT" ]; then
            printf '%s\n' '（未配置 VSCE_PAT，跳过 VS Code 扩展市场）'
          else
            # --skip-duplicate：标签重复运行时，已发布的同一版本不算失败。
            npx --yes @vscode/vsce publish --packagePath "$vsix" -p "$VSCE_PAT" --skip-duplicate
          fi

          if [ -z "$OVSX_PAT" ]; then
            printf '%s\n' '（未配置 OVSX_PAT，跳过 Open VSX）'
          elif curl -fsS "https://open-vsx.org/api/KOTONEX/AdwCode/$version" >/dev/null 2>&1; then
            printf '%s\n' "Open VSX 已存在 $version，跳过"
          else
            npx --yes ovsx publish "$vsix" -p "$OVSX_PAT"
          fi
